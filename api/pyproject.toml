[project]
name = "ytapi"
version = "0.1.0"
description = "YouTube catalog backend: metadata, stream URL resolution, recommendations"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.66",
    "grpcio-tools>=1.66",
    "pysocks>=1.7.1",
    "yt-dlp>=2025.1.1",
    "ytmusicapi>=1.9",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ytapi"]
