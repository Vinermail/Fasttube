[package]
name = "fasttube"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
cpal = "0.17"
getrandom = "0.4"
lofty = "0.25"
futures-util = "0.3"
parking_lot = "0.12"
prost = "0.14"
rayon = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "socks"] }
rodio = { version = "0.22.2", features = ["symphonia-mp3", "symphonia-flac", "symphonia-wav", "symphonia-vorbis", "symphonia-isomp4", "symphonia-aac"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
# System integration: media keys and the Windows volume overlay (souvlaki),
# one window per user, remembered geometry, autostart, notifications, hotkeys.
souvlaki = "0.9.3"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-notification = "2.8.0"
tauri-plugin-global-shortcut = "2.4.1"
tokio = { version = "1", features = ["rt", "time", "macros", "sync"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "channel", "codegen"] }
tonic-prost = "0.14"
walkdir = "2.5.0"
replaygain = "1.0.1"
tower = "0.5"
http = "1"

# Release: a faster, smaller binary. `panic = "abort"` is safe here - nothing
# in this crate unwinds on purpose (no catch_unwind), and a crash still takes the
# sidecar down with it: the child watches its stdin pipe and exits when it
# closes, which is exactly what happens when the process dies.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tauri-build = "2"
tonic-prost-build = "0.14"

[target.'cfg(windows)'.dependencies]
# DPAPI for the encrypted auth bundle (src/secrets.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
