syntax = "proto3";

package player;

message Empty {}

message HealthResponse {
  string status = 1;
  string version = 2;
  bool ytdlp_ready = 3;
  bool auth_ok = 4;
}

message Track {
  string video_id = 1;
  string title = 2;
  string artist = 3;
  string album = 4;
  double duration_secs = 5;
  string thumbnail = 6;
  // YouTube's per-item id: removing a track from a playlist needs it.
  string set_video_id = 7;
}

message AddPlaylistItemsRequest {
  string playlist_id = 1;
  repeated string video_ids = 2;
}

message PlaylistItemRef {
  string video_id = 1;
  string set_video_id = 2;
}

message RemovePlaylistItemsRequest {
  string playlist_id = 1;
  repeated PlaylistItemRef items = 2;
}

message PlaylistEditResponse {
  bool ok = 1;
  string error = 2;
  // Set by CreateAccountPlaylist.
  string id = 3;
}

message CreatePlaylistRequest {
  string title = 1;
}

message DeletePlaylistRequest {
  string playlist_id = 1;
}

message SearchRequest {
  string query = 1;
  int32 limit = 2;
  // "", "songs", "videos", "albums", "artists", "playlists"
  string filter = 3;
}

// One block of results, rendered as a titled group by the UI.
message SearchSection {
  string title = 1;
  // song | video | album | artist | playlist
  string kind = 2;
  repeated SearchItem items = 3;
}

message SearchItem {
  // song | video | album | artist | playlist
  string kind = 1;
  // videoId for song/video, browseId (or playlist id) for the rest
  string id = 2;
  string title = 3;
  string subtitle = 4;
  string thumbnail = 5;
  double duration_secs = 6;
  // innertube videoType, e.g. MUSIC_VIDEO_TYPE_OMV
  string video_type = 7;
  string browse_id = 8;
  string playlist_id = 9;
}

message SearchResponse {
  repeated SearchSection sections = 1;
  string error = 2;
}

message SuggestRequest {
  string query = 1;
}

message SuggestResponse {
  repeated string suggestions = 1;
}

message HomeRequest {
  int32 limit = 1;
}

message Shelf {
  string title = 1;
  // "personal" (signed in) or "explore" (public fallback)
  string kind = 2;
  repeated SearchItem items = 3;
}

message HomeResponse {
  repeated Shelf shelves = 1;
  string error = 2;
}

message AlbumRequest {
  string browse_id = 1;
}

message AlbumResponse {
  string title = 1;
  // "Album • 2013 • 13 tracks" style line for the header
  string subtitle = 2;
  string thumbnail = 3;
  SearchSection tracks = 4;
  string error = 5;
}

message ArtistRequest {
  string browse_id = 1;
}

message ArtistResponse {
  string name = 1;
  string subtitle = 2;
  string thumbnail = 3;
  // "Popular songs" and "Albums" sections
  repeated SearchSection sections = 4;
  string error = 5;
}

message ResolveRequest {
  string video_id = 1;
  string audio_quality = 2; // "standard" | "high"
  bool force = 3; // skip the cache and re-extract
  bool use_account = 4; // stream with the signed-in session (Premium/age-gated)
}

message ResolveResponse {
  bool ok = 1;
  string error = 2;
  Track track = 3;
  string stream_url = 4;
  string mime_type = 5;
  uint64 content_length = 6;
  int32 itag = 7;
}

message PrefetchResolveRequest {
  repeated string ids = 1;
  string audio_quality = 2;
  bool use_account = 3;
}

message PrefetchResolveResponse {
  int32 resolved = 1;
}

message RecommendRequest {
  string video_id = 1;
  int32 limit = 2;
}

message RecommendResponse {
  repeated Track tracks = 1;
}

message UserPlaylist {
  string id = 1;
  string name = 2;
  int32 track_count = 3;
  string thumbnail = 4;
}

message UserPlaylistsResponse {
  repeated UserPlaylist playlists = 1;
  bool has_auth = 2;
  string hint = 3;
  string error = 4;
}

message SetProxyRequest {
  // Empty or "none" disables the proxy; the sidecar then talks to the internet
  // directly (or through whatever the OS has).
  string url = 1;
}

message SetProxyResponse {
  bool ok = 1;
  string error = 2;
}

message PlaylistTracksRequest {
  string id = 1;
  // Paging: the UI draws the first page and asks for the rest while it loads.
  int32 offset = 2;
  int32 limit = 3;
}

message LikedSongsRequest {
  int32 offset = 1;
  int32 limit = 2;
}

message PlaylistTracksResponse {
  repeated Track tracks = 1;
  string error = 2;
  // Total number of tracks in the playlist (0 = unknown, keep paging).
  int32 total = 3;
  // False for a playlist saved from someone else, and for generated mixes:
  // both are read-only here.
  bool owned = 4;
}

message ParseAuthHeadersRequest {
  string text = 1;
}

message SetSessionRequest {
  string cookie = 1;
  string user_agent = 2;
  string x_goog_authuser = 3;
}

enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  SIGNED_OUT = 1;
  ACTIVE = 2;
  EXPIRED = 3;
}

message SessionStatus {
  SessionState state = 1;
  string account_name = 2;
  string error = 3;
}

message LyricsRequest {
  string artist = 1;
  string title = 2;
  double duration_secs = 3;
}

message LyricsResponse {
  bool ok = 1;
  string synced = 2;
  string plain = 3;
  string error = 4;
}

service PlayerApi {
  rpc Health(Empty) returns (HealthResponse);
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc Suggest(SuggestRequest) returns (SuggestResponse);
  rpc GetAlbum(AlbumRequest) returns (AlbumResponse);
  rpc GetArtist(ArtistRequest) returns (ArtistResponse);
  rpc GetHome(HomeRequest) returns (HomeResponse);
  rpc ResolveUrl(ResolveRequest) returns (ResolveResponse);
  rpc PrefetchResolve(PrefetchResolveRequest) returns (PrefetchResolveResponse);
  rpc Recommend(RecommendRequest) returns (RecommendResponse);
  rpc GetUserPlaylists(Empty) returns (UserPlaylistsResponse);
  rpc GetPlaylistTracks(PlaylistTracksRequest) returns (PlaylistTracksResponse);
  rpc GetLikedSongs(LikedSongsRequest) returns (PlaylistTracksResponse);
  rpc GetLyrics(LyricsRequest) returns (LyricsResponse);
  rpc SetSession(SetSessionRequest) returns (SessionStatus);
  rpc ParseAuthHeaders(ParseAuthHeadersRequest) returns (SetSessionRequest);
  rpc ValidateSession(Empty) returns (SessionStatus);
  rpc ClearSession(Empty) returns (SessionStatus);
  rpc SetProxy(SetProxyRequest) returns (SetProxyResponse);
  rpc AddPlaylistItems(AddPlaylistItemsRequest) returns (PlaylistEditResponse);
  rpc RemovePlaylistItems(RemovePlaylistItemsRequest) returns (PlaylistEditResponse);
  rpc CreateAccountPlaylist(CreatePlaylistRequest) returns (PlaylistEditResponse);
  rpc DeleteAccountPlaylist(DeletePlaylistRequest) returns (PlaylistEditResponse);
  rpc RemoveFromLibrary(DeletePlaylistRequest) returns (PlaylistEditResponse);
}
